services:
  - type: web
    name: carrels-client-galleries
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_ORIGINS
        value: https://www.carrels.photography,https://carrels.photography
